name: Setup Bun project
description: Configura Node, Bun, caché de dependencias e instalación

runs:
  using: composite
  steps:
    # 1. Configura el entorno Node.js
    - uses: actions/setup-node@v4
      with:
        node-version: "24.14.1"

    # 2. Configura el runtime Bun
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3.14"

    # 3. Cachea la carpeta node_modules basado en el hash de bun.lock
    - uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    # 4. Instala dependencias del proyecto
    - run: bun install
      shell: bash
