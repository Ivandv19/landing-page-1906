# ==============================================================================
# Fluxbeats CI/CD Pipeline
# ------------------------------------------------------------------------------

name: Fluxbeats CI/CD

# Disparadores: Pushes y Pull Requests a las ramas principales
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Lint y Verificación de Formato (Biome + TypeScript)
  # ----------------------------------------------------------------------------
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      # 1. Clona el repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configura Node, Bun y dependencias con caché
      - name: Setup Bun env
        uses: ./.github/actions/setup

      # 3. Ejecuta el linter de Biome
      - name: Lint con Biome
        run: bun run lint

      # 4. Verifica formato con Biome
      - name: Format check con Biome
        run: bun run check

      # 5. Verifica tipado estricto con TypeScript
      - name: TypeScript type check
        run: bunx tsc -b

  # ----------------------------------------------------------------------------
  # Job 2: Pruebas Unitarias (Vitest)
  # ----------------------------------------------------------------------------
  unit:
    name: Tests Unitarios (Vitest)
    runs-on: ubuntu-latest
    steps:
      # 1. Clona el repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configura Node, Bun y dependencias con caché
      - name: Setup Bun env
        uses: ./.github/actions/setup

      # 3. Ejecuta la suite completa de unit tests (Zustand, backend, componentes)
      - name: Tests unitarios
        run: bun run test:unit

  # ----------------------------------------------------------------------------
  # Job 3: Pruebas End-to-End (Playwright)
  # ----------------------------------------------------------------------------
  e2e:
    name: Suite E2E (Playwright)
    needs: [lint, unit]
    runs-on: ubuntu-latest
    steps:
      # 1. Clona el repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configura Bun, dependencias y binarios de Playwright Chromium
      - name: Setup E2E
        uses: ./.github/actions/setup-e2e

      # 3. Ejecuta la suite completa de pruebas End-to-End con clave de testing
      - name: Suite E2E (Playwright)
        run: bun run test:e2e
        env:
          VITE_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"

      # 4. Sube reportes y trazas si algún test falla
      - name: Subir reporte de Playwright en caso de fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ----------------------------------------------------------------------------
  # Job 4: Despliegue en Cloudflare Pages
  # ----------------------------------------------------------------------------
  deploy:
    name: Despliegue en Cloudflare Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, unit, e2e]
    runs-on: ubuntu-latest
    steps:
      # 1. Clona el código
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configura el entorno Bun
      - name: Setup Bun env
        uses: ./.github/actions/setup

      # 3. Compila para producción inyectando la clave real de Cloudflare Turnstile
      - name: Build de producción con credenciales reales
        run: bun run build
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}

      # 4. Publica en Cloudflare Pages usando Wrangler Action
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=fluxbeats
